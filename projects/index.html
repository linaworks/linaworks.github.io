<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · linaworks</title>
<meta name="description" content="Things I have built or am building.">
<meta property="og:type" content="website">
<meta property="og:title" content="Projects · linaworks">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Source+Sans+3:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>:root {
    --bg: #F6F3EC;
    --ink: #2B2F2C;
    --muted: #666A62;
    --green: #4A6648;
    --tint: #E3E9DA;
    --line: #DDD8CB;
    --serif: "Fraunces", Georgia, "Noto Serif SC", "Songti SC", serif;
    --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 1.0625rem/1.7 var(--sans);
  }
  a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 0.25em; }
  a:hover { color: var(--green); text-decoration-color: var(--green); }
  a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: 56rem; margin: 0 auto; padding: 0 clamp(1.5rem, 5vw, 4rem); }

  header { padding: 2rem 0 0; }
  header .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .mark { display: inline-flex; align-items: center; gap: 0.5rem; font: 400 1.125rem var(--serif); text-decoration: none; }
  .mark svg { width: 1.25rem; height: 1.25rem; color: var(--green); }
  nav { display: flex; gap: 1.5rem; font-size: 0.95rem; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover, nav a[aria-current] { color: var(--ink); }

  .hero { padding: 6rem 0 4.5rem; }
  .hero .kicker { color: var(--green); font-size: 0.95rem; margin: 0 0 1.25rem; }
  h1 {
    font: 400 clamp(2.25rem, 7vw, 3.5rem)/1.12 var(--serif);
    letter-spacing: -0.02em;
    margin: 0 0 1.75rem;
  }
  h1 span { display: block; }
  h1 { margin-bottom: 1rem; }
  .hero p.line { font: 400 clamp(1.15rem, 3.5vw, 1.4rem)/1.4 var(--serif); color: var(--green); margin: 0 0 1.75rem; }
  .hero p { max-width: 32rem; margin: 0 0 0.5rem; color: var(--ink); }
  .hero p.soft { color: var(--muted); }
  .hero .go { display: inline-block; margin-top: 1.5rem; color: var(--green); text-decoration-color: var(--green); }

  h2 { font: 400 1.5rem/1.3 var(--serif); margin: 0 0 0.35rem; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.75rem; }

  .garden { padding: 3rem 0; border-top: 1px solid var(--line); }
  .notes { list-style: none; margin: 0; padding: 0; }
  .notes li { border-top: 1px solid var(--line); }
  .notes li:last-child { border-bottom: 1px solid var(--line); }
  .notes a {
    display: grid;
    grid-template-columns: 1.5rem 1fr auto;
    gap: 0.9rem;
    align-items: baseline;
    padding: 0.9rem 0;
    text-decoration: none;
  }
  .notes svg { width: 1.1rem; height: 1.1rem; color: var(--green); align-self: center; }
  .notes .title { font-family: var(--serif); font-size: 1.1rem; }
  .notes .meta { color: var(--muted); font-size: 0.85rem; text-align: right; }
  .notes a:hover .title { color: var(--green); }

  .legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin: 1.25rem 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 0.875rem; }
  .legend li { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend svg { width: 1rem; height: 1rem; color: var(--green); }
  .more { margin: 1.25rem 0 0; font-size: 0.95rem; }

  .doors { padding: 3rem 0 4rem; border-top: 1px solid var(--line); }
  .doors dl { margin: 0; display: grid; gap: 1.5rem; }
  .doors dt { font: 400 1.2rem var(--serif); }
  .doors dt a { text-decoration: none; }
  .doors dd { margin: 0.1rem 0 0; color: var(--muted); }

  footer { padding: 2rem 0 3rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 1.5rem; }

  @media (max-width: 30rem) {
    .hero { padding: 4rem 0 3rem; }
    .notes a { grid-template-columns: 1.5rem 1fr; }
    .notes .meta { grid-column: 2; text-align: left; margin-top: -0.4rem; }
  }

  .page { padding: 4.5rem 0 4rem; }
  .page h1 { font-size: clamp(2rem, 6vw, 2.75rem); margin-bottom: 1rem; }
  .page .lede { color: var(--muted); max-width: 32rem; margin: 0 0 2.5rem; }
  .page p { max-width: 34rem; }
  .empty { border: 1px dashed var(--line); border-radius: 6px; padding: 1.5rem; color: var(--muted); max-width: 34rem; }
  .empty p { margin: 0; }

  /* look matched to the reference screenshot */
  .hero h1 span:nth-child(2) { color: var(--green); }
  .hero p.line { font: italic 400 clamp(1.15rem, 3.5vw, 1.4rem)/1.4 var(--serif); color: var(--muted); }
  .notes a { grid-template-columns: 1.5rem 1fr auto; align-items: center; }
  .notes .text { display: block; }
  .notes .title { display: block; }
  .notes .meta { display: block; text-align: left; font-size: 0.85rem; color: var(--muted); }
  .notes .arrow { color: var(--muted); }
  .doors dl { grid-template-columns: 1fr 1fr; gap: 1.5rem 2rem; }
  @media (max-width: 30rem) {
    .notes a { grid-template-columns: 1.5rem 1fr auto; }
    .notes .meta { grid-column: auto; margin-top: 0; }
    .doors dl { grid-template-columns: 1fr; }
  }
</style>
</head>
